

name: Enterprise CD Pipeline

on:

  workflow_run:
    workflows:
      - Enterprise CI Pipeline

    types:
      - completed

permissions:
  contents: read

jobs:

  deploy:

    name: Localhost Deployment

    runs-on: self-hosted

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Docker Version
        run: docker --version

      - name: Show Docker Compose Version
        run: docker compose version

      - name: Stop Existing Containers
        shell: powershell
        run: |
          try {
            docker compose down
          }
          catch {
            Write-Host "No existing containers found"
          }

      - name: Remove Unused Docker Images
        shell: powershell
        run: |
          try {
            docker system prune -af
          }
          catch {
            Write-Host "Docker cleanup skipped"
          }

      - name: Build and Deploy Containers
        run: docker compose up --build -d

      - name: Wait for Containers to Start
        run: Start-Sleep -Seconds 25

      - name: Verify Running Containers
        run: docker ps

      - name: Show Container Logs
        run: docker compose logs --tail=50

      - name: Frontend Health Check
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri http://localhost:3000 `
            -UseBasicParsing

      - name: Backend Health Check
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri http://localhost:5000 `
            -UseBasicParsing

      - name: Deployment Success
        run: echo "Enterprise Deployment Successful"